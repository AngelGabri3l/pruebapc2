name: CI-CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  # Cambia a linux/arm64 si tu VM de Oracle es Ampere (ARM)
  PLATFORM: linux/amd64

jobs:
  # 1) Secretos filtrados en el código/historial
  secrets-scan:
    name: Gitleaks (secretos)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Si el repo es de una ORGANIZACIÓN necesitas GITLEAKS_LICENSE (en repos personales no)

  # 2) SAST (Bandit) + SCA (pip-audit)
  sast-sca:
    name: Bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar herramientas
        run: pip install bandit pip-audit
      - name: Bandit (análisis estático del código)
        run: bandit -r app.py -ll
      - name: pip-audit (vulnerabilidades en dependencias)
        run: pip-audit -r requirements.txt

  # 3) Pruebas contra un MySQL real (service container)
  test:
    name: Pruebas con MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: ci_test_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: testdb
          DB_USER: testuser
          DB_PASSWORD: ci_test_pw
        run: pytest -v

  # 4) Lint Dockerfile + build + escaneo Trivy + push a GHCR (solo en main)
  build-scan-push:
    name: Build, Hadolint, Trivy, Push
    needs: [secrets-scan, sast-sca, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen (minúsculas)
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Hadolint (lint del Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (falla si hay CRITICAL/HIGH con parche disponible)
        # Fijada por SHA (v0.36.0). Aqua migró los tags a prefijo 'v' tras un ataque a su cadena de suministro.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push a GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

  # 5) Deploy a Oracle Cloud: solo main, solo si TODO lo anterior pasó
  deploy:
    name: Deploy a Oracle Cloud
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # puedes exigir aprobación manual en este Environment
    permissions:
      contents: read
      packages: read
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
      APP_DIR: /opt/app   # carpeta en la VM (créala una vez, ver README)
      REPO_URL: https://github.com/${{ github.repository }}.git
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Preparar SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          for v in OCI_HOST OCI_USER OCI_SSH_KEY OCI_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::El secret $v está vacío o no existe (revisa nombre exacto y que esté en el Environment 'production' o en Repository secrets)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          # tr -d '\r' quita saltos de línea de Windows (si no, la llave puede fallar al leerse)
          printf '%s\n' "$OCI_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$OCI_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          # Funciona con cualquier tipo de llave (RSA de Oracle, ed25519, etc.)
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::OCI_SSH_KEY no es una llave privada válida. Pega el archivo completo (con BEGIN/END), en formato PEM de Oracle, no .ppk"; exit 1; }

      - name: Actualizar código en la VM (git) y generar .env
        env:
          IMAGE: ${{ needs.build-scan-push.outputs.image }}:${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -o ConnectTimeout=15 "$OCI_USER@$OCI_HOST" 'echo conexion_ssh_ok' \
            || { echo "::error::Falló la conexión SSH (host key, usuario, llave o puerto 22). Revisa OCI_KNOWN_HOSTS, OCI_SSH_KEY, OCI_USER y OCI_HOST"; exit 1; }
          ssh "$OCI_USER@$OCI_HOST" "test -d '$APP_DIR' && test -w '$APP_DIR'" \
            || { echo "::error::$APP_DIR no existe o no es escribible por $OCI_USER en la VM (ver README, paso 2)"; exit 1; }
          # Primer deploy: clona. Siguientes: fetch + dejar el árbol exactamente en el commit que pasó el pipeline.
          ssh "$OCI_USER@$OCI_HOST" "set -e; cd '$APP_DIR'; [ -d .git ] || git clone '$REPO_URL' .; git fetch --prune origin; git reset --hard '$COMMIT_SHA'"
          printf 'IMAGE=%s\nWEB_PORT=80\nMYSQL_ROOT_PASSWORD=%s\nDB_NAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\n' \
            "$IMAGE" "$MYSQL_ROOT_PASSWORD" "$DB_NAME" "$DB_USER" "$DB_PASSWORD" \
            | ssh "$OCI_USER@$OCI_HOST" "umask 077 && cat > '$APP_DIR/.env'"

      - name: Login a GHCR en la VM y levantar contenedores
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$OCI_USER@$OCI_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "$OCI_USER@$OCI_HOST" "cd '$APP_DIR' && docker compose pull web && docker compose up -d --no-build --remove-orphans && docker image prune -f"

      - name: Smoke test (a través del balanceador)
        env:
          LB_HOST: ${{ secrets.LB_HOST }}
        run: |
          [ -n "$LB_HOST" ] || { echo "::error::Falta el secret LB_HOST (IP pública del balanceador)"; exit 1; }
          curl -fsS --retry 12 --retry-delay 5 --retry-connrefused "http://$LB_HOST/health"

  # 6) DAST opcional: OWASP ZAP contra la app ya desplegada (no bloquea)
  dast:
    name: OWASP ZAP (baseline)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: zaproxy/action-baseline@v0.12.0
        # La action sube su reporte con una API de artifacts retirada por GitHub y falla al final.
        # El escaneo sí corre; por eso se ignora ese fallo y el reporte se sube abajo con upload-artifact@v4.
        continue-on-error: true
        with:
          target: http://${{ secrets.LB_HOST }}
          allow_issue_writing: false
          fail_action: false

      - name: Subir reporte de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reporte
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn